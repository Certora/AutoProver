title: CVLR Situation Recipes — Trigger Index
precedence: Where these recipes and the Solana/CVLR manual or other Certora materials diverge, the
  recipes govern.
usage: Match a trigger; retrieve the pointed file before acting. When the file is unavailable,
  search_terms are literal identifiers findable in the manual or the CVLR corpus; entries without
  search_terms have no external source — the file is authoritative.
channels:
  RULE: 'Actionable directly: write it in the harness module, through `put_harness`.'
  MOCK: The fix is a `summarize_for_prover` stand-in. Unsound by construction, so it is for code the
    properties do not depend on, and it invalidates the prover stamp.
  EDIT: The fix is in the program''s own source. Describe the problem to `code_editor`; you do not
    edit the program yourself.
  CONF: 'The fix is a prover setting. Only two are yours: the loop bound and `optimistic_loop`, and
    the second changes what a verdict means. Anything else is a `record_skip` naming the setting and
    the evidence for it.'
  SKIP: There is no fix in your action space. `record_skip` with a reason a reviewer can act on,
    which is worth more than a rule that looks like the property and is not.
recipes:
- id: K1
  name: Satisfy rules, and the one they must not replace
  triggers:
  - A harness whose setup you are not yet sure the prover can execute at all
  - A branch or post-state you want shown to be reachable at least once
  - An acceptance property ("the handler accepts X") you are tempted to state as a satisfy rule
  channel: RULE
  file: recipes/cvlr-k1-satisfy-for-reachability.md
  search_terms:
  - cvlr_satisfy
  - cvlr_sanity_checked
- id: K2
  name: Log the value an assertion reads when it is an enum or a bitfield
  triggers:
  - Asserting over a status field, enum discriminant, or a chain of `is_x!(..) || is_y!(..)` tests
  - A rule over such a value fails with a counterexample that looks arbitrary rather than wrong
  channel: RULE
  file: recipes/cvlr-k2-clog-before-enum-assert.md
  search_terms:
  - clog
  - cvlr_assert
- id: K3
  name: Sysvars, read directly and tied to the syscall
  triggers:
  - A handler reads `Clock` or `Rent`, by syscall or from a sysvar account
  - You are about to split a handler, mock a read, or skip a property because a sysvar read is
    external
  - A property about the rent-exempt reserve or `minimum_balance`
  channel: RULE
  file: recipes/cvlr-k3-sysvars-read-directly.md
  search_terms:
  - from_account_info
  - Clock::get
  - Rent::get
  - minimum_balance
- id: K4
  name: A loop the bound does not finish
  triggers:
  - A rule stops on `Unwinding condition in a loop`
  - You are about to raise `loop_iter` or turn on `optimistic_loop`
  - A property over a loop whose trip count is set by account data
  channel: [CONF, RULE]
  file: recipes/cvlr-k4-loop-the-bound-does-not-finish.md
  pushed_on:
  - generated: loopUnwinding
  search_terms:
  - loop_iter
  - optimistic_loop
- id: K5
  name: '`Cannot overflow` on an inferred pointer'
  triggers:
  - "A rule stops on `Cannot overflow: inferred pointer` or `Cannot overflow: computing TAC map index`"
  channel: [RULE, SKIP]
  file: recipes/cvlr-k5-cannot-overflow-inferred-pointer.md
  pushed_on:
  - generated: cannotOverflow
