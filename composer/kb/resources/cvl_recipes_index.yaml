title: CVL Situation Recipes — Trigger Index
precedence: Where these recipes and the CVL manual or other Certora materials diverge, the recipes govern.
usage: Match a trigger; retrieve the pointed file before acting. When the file is unavailable, search_terms
  are literal identifiers findable in the manual or knowledge base; entries without search_terms have
  no external source — the file is authoritative.
channels:
  CVL: 'Actionable directly: write the spec construct.'
  CONF: The fix is a Prover configuration setting, outside this agent's action space. Surface the diagnosis,
    naming the setting and the evidence for it, and stop. A CVL-space approximation is not a substitute
    for a conf-space fix.
  EDIT: 'The fix involves a limited source edit or auxiliary Solidity file. Obligations on every edit:
    the diff is minimal, and it carries a stated argument that the edit preserves the semantics relevant
    to the properties under verification.'
recipes:
- id: R1
  name: ERC-7201 namespaced storage
  triggers:
  - Struct annotated @custom:storage-location erc7201:... plus an assembly slot getter
  channel: CONF
  file: recipes/r01-erc7201-storage-extension.md
  search_terms:
  - storage_extension_annotation
  - '@custom:storage-location'
  - erc7201
- id: R2
  name: Raw-slot storage harness
  triggers:
  - Storage getter with assembly { x.slot := CONSTANT }, no erc7201 annotation
  - R1 applied but no ext_ path materialized (namespace outside recognized grammar)
  channel: [CONF, EDIT]
  file: recipes/r02-certoralink-harness.md
  search_terms:
  - storage_extension_harnesses
  - '@custom:certoralink'
- id: R3
  name: Transient-storage lock mirroring
