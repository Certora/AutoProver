# Cargo workspace for AutoProver's Rust extension framework.
#
# * `autoprover-sdk` — the library new Rust-based applications import. It defines
#   the ABI (serde types), the `Backend` trait, the `run_confined` launcher helper,
#   the FFI helpers, and the `export_app!` macro that emits the PyO3 module.
# * `autoprover-solana` — one *chain's* half of the project seam: the types a Solana
#   wheel and the host's Solana `ProjectToolchain` share, which the SDK deliberately
#   does not define (`autoprover_sdk::chain`). A second ecosystem is a second crate
#   like this one, not an edit to the SDK.
# * `example-app`   — a self-contained demonstration application built into a
#   Python wheel via maturin, used by the framework's round-trip test.
#
# A new application is its own crate (cdylib) that depends on `autoprover-sdk`
# and invokes `autoprover_sdk::export_app!`. It lives outside this workspace in
# real use; `example-app` is kept here so the framework has something to test.
[workspace]
resolver = "2"
members = ["autoprover-sdk", "autoprover-solana", "example-app", "run-confined"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = "0.24"
# Compile-time Jinja-style templates (the `.j2` convention used by composer/templates/*.j2,
# here for the Rust prompt/crate-file templates). Templates are checked at build time and
# embedded in the wheel, so no runtime template loading or packaging.
askama = "0.13"
