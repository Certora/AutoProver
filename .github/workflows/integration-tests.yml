name: Integration Tests

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch: {} # adds a "Run workflow" button in the Actions tab

# If a manual run and a scheduled run overlap, cancel the older one
# so you don't pay for the expensive job twice.
concurrency:
  group: scheduled-tests
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod # Both dev/stg are available as well
    env:
      CERTORA_LAMBDA_URL: ${{ secrets.LAMBDA_FUNCTION_URL }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: integration

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: sync-deps
        # --no-dev skips the `dev` group and the `apps` group it includes, so this
        # job never builds the `rust/` wheels and never installs the pinned
        # toolchain. Anything here that shelled out to cargo would make rustup
        # fetch that toolchain mid-test — the fuzz step below is scoped to avoid
        # exactly that. Every `uv run` below needs the flag too: a bare `uv run`
        # re-syncs with the default groups and would pull `apps` back in.
        run: |
          uv sync --group test --extra prover --no-dev

      - name: sync solc
        run: |
          uv pip install solc-select
          uv run --no-dev solc-select install 0.8.29
          uv run --no-dev solc-select use 0.8.29
          # certoraRun resolves Certora-convention names like `solc8.29` as
          # literal executables; solc-select only ships the `solc` shim, so
          # fetch the static binary under that exact name.
          sudo curl -fsSL https://github.com/ethereum/solidity/releases/download/v0.8.29/solc-static-linux \
            -o /usr/local/bin/solc8.29
          sudo chmod +x /usr/local/bin/solc8.29
          solc8.29 --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Basic who-am-i check
        run: |
          # The stored URL ends in a slash and //who-am-i would not route.
          curl -sS --fail-with-body "${CERTORA_LAMBDA_URL%/}/who-am-i" \
            --user "$AWS_ACCESS_KEY_ID":"$AWS_SECRET_ACCESS_KEY" \
            -H "x-amz-security-token: $AWS_SESSION_TOKEN" \
            --aws-sigv4 "aws:amz:us-west-2:lambda"

      - name: run autoprover integration tests
        run: |
          uv run --no-dev pytest -n 3 -m 'expensive' tests
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
      # `fuzz` deliberately excludes the wire round trips, which are marked `wire`:
      # they build a cargo binary at test time and this job has no Rust toolchain.
      # pytest.yml runs them, on every push to master, with the toolchain installed
      # and rust/target cached.
      - name: run template fuzz tests
        run: |
          uv run --no-dev pytest -n 2 -m 'fuzz' tests
        env:
          HYPOTHESIS_PROFILE: extended

      # Fires ONLY if a step above failed. The whole point of the file.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \":red_circle: *AutoProver integration tests failed* in \`${{ github.repository }}\`\n<${RUN_URL}|View the failed run>\"
            }" \
            "$SLACK_WEBHOOK_URL"
